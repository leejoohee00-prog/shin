<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>타이머</title>
<style>
  :root{
    --bg: #000000;
    --card: #171E36;
    --card-edge: #232B4C;
    --ink: #F3F1EA;
    --muted: #8A90B8;
    --accent: #35D0A8;
    --accent-dim: #1E3A38;
    --danger: #FF6B6B;
    --danger-dim: #3A2230;
    --track: #1F2645;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%;
    background: linear-gradient(180deg, #1E3B29 0%, #2C5236 38%, #6B7B3A 72%, #C9A66B 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow-x:hidden;
    position: relative;
  }
  .leaf-deco{
    position: fixed; font-size: 90px; opacity:.16; pointer-events:none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.3));
    z-index:0;
  }
  .leaf-tl{ top:-20px; left:-24px; transform: rotate(-18deg); }
  .leaf-br{ bottom:-24px; right:-20px; transform: rotate(160deg); }
  .leaf-bl{ bottom:10px; left:-30px; font-size:70px; transform: rotate(-100deg); opacity:.12; }
  #root{ position:relative; z-index:1; }
  #root{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
  .app{ width:100%; max-width: 380px; display:flex; flex-direction:column; gap:18px; align-items:center; }
  .ring-wrap{ position:relative; width: min(70vw, 260px); height: min(70vw, 260px); }
  .ring-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .ring-ear{ fill: #5C3A21; transition: fill .3s ease; }
  .ring-face{ fill: #C68B59; transition: fill .3s ease; }
  .ring-ear.angry{ fill: #7A2E1A; }
  .ring-face.angry{ fill: #B8552E; }
  .ring-wrap.angry{ animation: angryShake .35s ease infinite; }
  @keyframes angryShake{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-3deg); }
    75%{ transform: rotate(3deg); }
  }
  .ring-bg{ fill:none; stroke: rgba(0,0,0,.28); stroke-width: 10; }
  .ring-fg{ fill:none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s ease; }
  .ring-fg.danger{ stroke: var(--danger); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .ring-emoji{
    font-size: clamp(30px, 9vw, 44px); line-height:1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
  }
  .time-display{
    font-size: clamp(26px, 8vw, 36px); font-weight:700;
    font-variant-numeric: tabular-nums; letter-spacing:-0.02em;
  }
  .time-display.danger{ color: var(--danger); }
  .state-label{ font-size:12px; color: var(--muted); letter-spacing:.05em; }

  .presets{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .preset-btn{
    padding: 8px 14px; border-radius:999px; border:1px solid var(--card-edge);
    background: var(--card); color: var(--ink); font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .preset-btn:active{ transform: scale(.94); }
  .preset-btn.active{ background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .custom-row{ display:flex; align-items:center; gap:8px; }
  .custom-input{
    width: 62px; text-align:center; font-size:18px; padding: 8px 4px;
    border-radius:10px; border:1.5px solid var(--card-edge);
    background: var(--card); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .custom-input:focus{ outline:none; border-color:#3D4470; }
  .custom-sep{ color: var(--muted); font-size:13px; }
  .custom-label{ color: var(--muted); font-size:12px; margin-right:2px; }

  .controls{ display:flex; gap:10px; width:100%; }
  button.act{
    flex:1; border:none; border-radius:16px; padding: 14px 8px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    transition: transform .08s ease, opacity .2s ease;
  }
  button.act:active{ transform: scale(.96); }
  button.act:disabled{ opacity:.4; cursor:default; }
  .btn-start{ background: var(--accent); color:#08201A; }
  .btn-pause{ background: #FFD166; color:#3A2A00; }
  .btn-reset{ background: var(--track); color: var(--ink); }

  .done-banner{
    display:none; text-align:center; color: var(--danger); font-size:14px; font-weight:700;
  }
  .done-banner.show{ display:block; animation: blink 1s ease infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
</style>
</head>
<body>
<div class="leaf-deco leaf-tl">🌿</div>
<div class="leaf-deco leaf-br">🌴</div>
<div class="leaf-deco leaf-bl">🍃</div>
<div id="root"></div>

<script>
const RADIUS = 100;
const CIRC = 2 * Math.PI * RADIUS;
const PRESETS = [10, 30, 60, 180, 300, 600]; // 10초, 30초, 1분, 3분, 5분, 10분

let totalSeconds = 300; // 기본 5분
let remainingSeconds = 300;
let running = false;
let intervalId = null;
let audioCtx = null;

function pad(n){ return String(n).padStart(2,"0"); }
function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${pad(m)}:${pad(sec)}`;
}

function playBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const calls = [
      {start:0.00, dur:0.16, f1:320, f2:820},
      {start:0.20, dur:0.14, f1:380, f2:900},
      {start:0.38, dur:0.17, f1:300, f2:780},
      {start:0.60, dur:0.13, f1:420, f2:950},
      {start:0.78, dur:0.16, f1:340, f2:840}
    ];
    calls.forEach(c => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(c.f1, now + c.start);
      osc.frequency.linearRampToValueAtTime(c.f2, now + c.start + c.dur * 0.45);
      osc.frequency.linearRampToValueAtTime(c.f1 * 0.85, now + c.start + c.dur);
      gain.gain.setValueAtTime(0.0001, now + c.start);
      gain.gain.exponentialRampToValueAtTime(0.28, now + c.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + c.start + c.dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + c.start);
      osc.stop(now + c.start + c.dur + 0.02);
    });
  } catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
}

function setPreset(sec){
  if(running) return;
  totalSeconds = sec;
  remainingSeconds = sec;
  render();
}

function applyCustom(){
  const mEl = document.getElementById("customMin");
  const sEl = document.getElementById("customSec");
  let m = parseInt(mEl.value, 10); if(isNaN(m) || m < 0) m = 0;
  let s = parseInt(sEl.value, 10); if(isNaN(s) || s < 0) s = 0;
  const total = m*60 + s;
  if(total <= 0) return;
  totalSeconds = total;
  remainingSeconds = total;
  render();
}

function playTick(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 700;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  } catch(e){}
  if(navigator.vibrate) navigator.vibrate(60);
}

function start(){
  if(running || remainingSeconds <= 0) return;
  running = true;
  intervalId = setInterval(() => {
    remainingSeconds -= 1;
    if(remainingSeconds > 0 && remainingSeconds <= 3){
      playTick();
    }
    if(remainingSeconds <= 0){
      remainingSeconds = 0;
      running = false;
      clearInterval(intervalId);
      playBeep();
    }
    render();
  }, 1000);
  render();
}

function pause(){
  running = false;
  clearInterval(intervalId);
  render();
}

function reset(){
  running = false;
  clearInterval(intervalId);
  remainingSeconds = totalSeconds;
  render();
}

function render(){
  const pct = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
  const offset = CIRC * (1 - pct);
  const isDanger = remainingSeconds <= 10 && remainingSeconds > 0;
  const isDone = remainingSeconds === 0;
  const stateLabel = isDone ? "완료!" : running ? "진행 중" : "대기 중";

  document.getElementById("root").innerHTML = `
    <div class="app">
      <div class="ring-wrap ${isDone ? "angry" : ""}">
        <svg viewBox="0 0 220 220">
          <circle class="ring-ear ${isDone ? "angry" : ""}" cx="46" cy="44" r="36"></circle>
          <circle class="ring-ear ${isDone ? "angry" : ""}" cx="174" cy="44" r="36"></circle>
          <circle class="ring-face ${isDone ? "angry" : ""}" cx="110" cy="110" r="100"></circle>
          <circle class="ring-bg" cx="110" cy="110" r="${RADIUS}"></circle>
          <circle class="ring-fg ${isDanger || isDone ? "danger" : ""}" cx="110" cy="110" r="${RADIUS}"
            stroke-dasharray="${CIRC}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-emoji">${isDone ? "🐵💢" : "🐵"}</div>
          <div class="time-display ${isDanger || isDone ? "danger" : ""}">${formatTime(remainingSeconds)}</div>
          <div class="state-label">${stateLabel}</div>
        </div>
      </div>

      <div class="done-banner ${isDone ? "show" : ""}">🐵 우끼! 우끼!</div>

      <div class="presets">
        ${PRESETS.map(p => `
          <button class="preset-btn ${totalSeconds === p && remainingSeconds === totalSeconds ? "active" : ""}" data-preset="${p}" ${running ? "disabled" : ""}>${p < 60 ? `${p}초` : `${p/60}분`}</button>
        `).join("")}
      </div>

      <div class="custom-row">
        <span class="custom-label">직접 설정</span>
        <input id="customMin" class="custom-input" type="number" min="0" inputmode="numeric" placeholder="분" ${running ? "disabled" : ""} />
        <span class="custom-sep">분</span>
        <input id="customSec" class="custom-input" type="number" min="0" max="59" inputmode="numeric" placeholder="초" ${running ? "disabled" : ""} />
        <span class="custom-sep">초</span>
      </div>
      <div class="controls">
        <button class="act btn-reset" id="applyCustomBtn" ${running ? "disabled" : ""} style="flex:none; padding:14px 16px;">설정</button>
        ${running
          ? `<button class="act btn-pause" id="pauseBtn">일시정지</button>`
          : `<button class="act btn-start" id="startBtn" ${remainingSeconds<=0 ? "disabled" : ""}>${remainingSeconds < totalSeconds && remainingSeconds > 0 ? "이어서 시작" : "시작"}</button>`
        }
        <button class="act btn-reset" id="resetBtn">초기화</button>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-preset]").forEach(btn => {
    btn.addEventListener("click", () => setPreset(parseInt(btn.dataset.preset, 10)));
  });
  document.getElementById("applyCustomBtn").addEventListener("click", applyCustom);
  const startBtn = document.getElementById("startBtn");
  if(startBtn) startBtn.addEventListener("click", start);
  const pauseBtn = document.getElementById("pauseBtn");
  if(pauseBtn) pauseBtn.addEventListener("click", pause);
  document.getElementById("resetBtn").addEventListener("click", reset);
}

render();
</script>
</body>
</html>
