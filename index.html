  .settings-btn:active{ transform: scale(.9); }
  .eyebrow{ font-size: clamp(10px, 3.2vw, 13px); letter-spacing:.04em; color: var(--muted); margin:0; }
  .time{
    font-size: clamp(30px, 12vw, 46px);
    font-weight:700; letter-spacing:-0.02em; line-height:1.05;
    margin: 0; font-variant-numeric: tabular-nums;
    transition: transform .15s ease;
  }
  .time.over{ color: var(--add); }
  .time.pulse-add{ animation: pulseAdd .35s ease; }
  .time.pulse-sub{ animation: pulseSub .35s ease; }
  @keyframes pulseAdd{ 0%{transform:scale(1)} 40%{transform:scale(1.08); color:var(--add)} 100%{transform:scale(1)} }
  @keyframes pulseSub{ 0%{transform:scale(1)} 40%{transform:scale(.94); color:var(--sub)} 100%{transform:scale(1)} }
  .sub{ color: var(--muted); font-size: clamp(9px, 2.8vw, 12px); margin: 0 0 2px; }
  .track{ width:78%; margin:0 auto; height:6px; border-radius:99px; background: var(--track); overflow:hidden; }
  .fill{ height:100%; border-radius:99px; background: linear-gradient(90deg, var(--sub), #FFD166 55%, var(--add)); transition: width .3s ease; }
  .track-label{ display:flex; justify-content:space-between; width:78%; margin:0 auto; font-size: clamp(8px, 2.4vw, 10px); color: var(--muted); margin-bottom: 2px; }
  .buttons{ display:flex; gap: 22px; justify-content:center; }
  button.act{
    flex:0 0 auto; border:none; background:none; padding:0;
    font-family: inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; transition: transform .08s ease, opacity .2s ease;
    -webkit-user-select:none; user-select:none;
  }
  button.act:active{ transform: scale(.92); }
  button.act:disabled{ opacity:.4; cursor:default; }
  .face-circle{
    width:auto; height:auto;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(42px, 16vw, 64px); line-height:1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  .btn-label{ font-size: clamp(10px, 3.2vw, 13px); font-weight:700; }
  .btn-add .btn-label{ color: var(--add); }
  .btn-sub .btn-label{ color: var(--sub); }
  .btn-note{ font-size: clamp(8px, 2.4vw, 10px); font-weight:500; color: var(--muted); }
  .footer{ color: var(--muted); font-size: clamp(8px, 2.4vw, 10px); line-height:1.4; margin-top:1px; }

  .overlay{
    position:fixed; inset:0; background: rgba(0,0,0,.82);
    display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    width: min(72vw, 300px); max-height: 82vh; overflow-y:auto;
    background: var(--card); border:1px solid var(--card-edge); border-radius:18px;
    padding: 14px 12px; display:flex; flex-direction:column; gap: 8px;
  }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; }
  .modal-title{ font-size: clamp(10px,3vw,13px); font-weight:700; margin:0; }
  .modal-close{ background:none; border:none; color: var(--muted); font-size: 15px; cursor:pointer; padding:2px 4px; line-height:1; }
  .modal-desc{ color: var(--muted); font-size: clamp(8px,2.4vw,10.5px); margin:0; line-height:1.4; white-space:pre-line; text-align:center; }
  .pin-input{
    width:100%; text-align:center; font-size: clamp(16px,5vw,22px); letter-spacing: 8px;
    padding: 8px 0 8px 8px; border-radius:10px;
    border:1.2px solid var(--card-edge); background: var(--bg); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .pin-input:focus{ outline:none; border-color:#3D4470; }
  .num-input{
    width:100%; text-align:center; font-size: clamp(13px,4vw,17px); padding: 7px 0;
    border-radius:10px; border:1.2px solid var(--card-edge);
    background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .field-label{ font-size: clamp(7px,2.2vw,9px); color: var(--muted); margin: 1px 0 -4px; }
  .error-text{ color: var(--danger); font-size: clamp(7px,2.2vw,9.5px); margin:0; min-height:12px; }
  .success-text{ color: var(--add); font-size: clamp(7px,2.2vw,9.5px); margin:0; min-height:12px; }
  .modal-actions{ display:flex; gap:6px; margin-top:1px; }
  .btn-plain{ flex:1; padding:8px; border-radius:10px; border:none; font-weight:700; font-size: clamp(8px,2.6vw,11px); font-family:inherit; cursor:pointer; }
  .btn-cancel{ background: var(--track); color: var(--ink); }
  .btn-confirm{ background: var(--add); color:#08201A; }

<body>
<div id="root"></div>

<script>
const TOTAL_MIN = 270;
const STORAGE_STATE_KEY = "weekly-screen-time-v1";
const STORAGE_PIN_KEY = "weekly-screen-time-pin-hash";
const DEFAULT_PIN_HASH = "e97776493f213d50b346f81e3f93a78aad1fd0f19c051a38bd8f88b43e46e5b5"; // 초기 비밀번호 1506

function pad(n){ return String(n).padStart(2,"0"); }
function getMondayISO(date){
  const d = new Date(date);
  const day = d.getDay();
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diffToMonday);
  d.setHours(0,0,0,0);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function daysUntilNextMonday(){
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? 1 : (8 - day);
  return diff === 7 ? 0 : diff;
}
function formatTime(totalMinutes){
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  if(h > 0 && m > 0) return `${h}시간 ${m}분`;
  if(h > 0) return `${h}시간`;
  return `${m}분`;
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function loadState(){
  const currentMonday = getMondayISO(new Date());
  try{
    const raw = localStorage.getItem(STORAGE_STATE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.weekStart === currentMonday) return parsed;
    }
  } catch(e){}
  const fresh = { remainingMinutes: TOTAL_MIN, weekStart: currentMonday, addCount: 0, subCount: 0 };
  saveState(fresh);
  return fresh;
}
function saveState(state){ try{ localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state)); } catch(e){} }
function getSavedPinHash(){
  try{
    const saved = localStorage.getItem(STORAGE_PIN_KEY);
    if(saved) return saved;
    localStorage.setItem(STORAGE_PIN_KEY, DEFAULT_PIN_HASH);
    return DEFAULT_PIN_HASH;
  } catch(e){ return DEFAULT_PIN_HASH; }
}
function savePinHash(hash){ try{ localStorage.setItem(STORAGE_PIN_KEY, hash); } catch(e){} }
function isValidPin(v){ return /^[0-9]{4}$/.test(v); }

let state = loadState();
let view = "main";
let settingsStage = "lock";

function addMinute(){ state.remainingMinutes += 1; state.addCount = (state.addCount || 0) + 1; saveState(state); render(true, "add"); }
function subMinute(){ if(state.remainingMinutes <= 0) return; state.remainingMinutes -= 1; state.subCount = (state.subCount || 0) + 1; saveState(state); render(true, "sub"); }
function openSettings(){ view = "settings"; settingsStage = "lock"; render(); }
function closeOverlay(){ view = "main"; render(); }

async function submitUnlock(){
  const input = document.getElementById("unlockPinInput");
  const errEl = document.getElementById("unlockError");
  const val = input.value.trim();
  if(!isValidPin(val)){ errEl.textContent = "4자리 숫자를 입력해 주세요."; return; }
  const entered = await sha256(val);
  if(entered !== getSavedPinHash()){
    errEl.textContent = "비밀번호가 올바르지 않아요.";
    const modal = document.getElementById("modalBox");
    modal.classList.remove("shake"); void modal.offsetWidth; modal.classList.add("shake");
    input.value = ""; input.focus();
    return;
  }
  settingsStage = "body";
  render();
}

function applyTimeSet(){
  const input = document.getElementById("timeSetInput");
  const errEl = document.getElementById("timeError");
  const okEl = document.getElementById("timeSuccess");
  const raw = input.value.trim();
  const val = parseInt(raw, 10);
  if(raw === "" || isNaN(val) || val < 0){
    errEl.textContent = "0 이상 숫자(분)를 입력해 주세요.";
    okEl.textContent = "";
    return;
  }
  errEl.textContent = "";
  state.remainingMinutes = val;
  saveState(state);
  okEl.textContent = `저장됨 (${formatTime(val)})`;
}

async function applyPinChange(){
  const errEl = document.getElementById("pinChangeError");
  const okEl = document.getElementById("pinChangeSuccess");
  okEl.textContent = "";
  const oldPin = document.getElementById("oldPinInput").value.trim();
  const newPin = document.getElementById("newPinInput").value.trim();
  const newPin2 = document.getElementById("newPinInput2").value.trim();

  if(!isValidPin(oldPin)){ errEl.textContent = "현재 비밀번호를 입력해 주세요."; return; }
  const oldHash = await sha256(oldPin);
  if(oldHash !== getSavedPinHash()){ errEl.textContent = "현재 비밀번호가 올바르지 않아요."; return; }
  if(!isValidPin(newPin) || !isValidPin(newPin2)){ errEl.textContent = "새 비밀번호는 숫자 4자리로 입력해 주세요."; return; }
  if(newPin !== newPin2){ errEl.textContent = "새 비밀번호가 서로 달라요."; return; }

  const newHash = await sha256(newPin);
  savePinHash(newHash);
  errEl.textContent = "";
  okEl.textContent = "변경 완료";
  document.getElementById("oldPinInput").value = "";
  document.getElementById("newPinInput").value = "";
  document.getElementById("newPinInput2").value = "";
}

function renderUnlockModal(){
  return `
    <div class="overlay">
      <div class="modal" id="modalBox">
        <div class="modal-header">
          <p class="modal-title">설정 잠금 해제</p>
          <button class="modal-close" id="closeBtn">✕</button>
        </div>
        <p class="modal-desc">비밀번호 4자리를 입력해 주세요.</p>
        <input id="unlockPinInput" class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />
        <p class="error-text" id="unlockError"></p>
        <div class="modal-actions">
          <button class="btn-plain btn-cancel" id="cancelBtn">취소</button>
          <button class="btn-plain btn-confirm" id="unlockBtn">확인</button>
        </div>
      </div>
    </div>
  `;
}

function renderSettingsBody(){
  return `
    <div class="overlay">
      <div class="modal" id="modalBox">
        <div class="modal-header">
          <p class="modal-title">설정</p>
          <button class="modal-close" id="closeBtn">✕</button>
        </div>
        <div class="settings-face"></div>

        <p class="section-title">남은 시간 직접 설정</p>
        <p class="field-label">분 단위 (예: 25)</p>
        <input id="timeSetInput" class="num-input" type="number" min="0" inputmode="numeric" value="${state.remainingMinutes}" />
        <div class="modal-actions">
          <button class="btn-plain btn-confirm" id="applyTimeBtn">적용</button>
        </div>
        <p class="error-text" id="timeError"></p>
        <p class="success-text" id="timeSuccess"></p>

        <div class="divider"></div>

        <p class="section-title">비밀번호 변경</p>
        <p class="field-label">현재 비밀번호</p>
        <input id="oldPinInput" class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="font-size:15px; letter-spacing:6px; padding:6px 0 6px 6px;" />
        <p class="field-label">새 비밀번호</p>
        <input id="newPinInput" class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="font-size:15px; letter-spacing:6px; padding:6px 0 6px 6px;" />
        <p class="field-label">새 비밀번호 확인</p>
        <input id="newPinInput2" class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="font-size:15px; letter-spacing:6px; padding:6px 0 6px 6px;" />
        <div class="modal-actions">
          <button class="btn-plain btn-confirm" id="applyPinBtn">변경</button>
        </div>
        <p class="error-text" id="pinChangeError"></p>
        <p class="success-text" id="pinChangeSuccess"></p>

        <div class="modal-actions">
          <button class="btn-plain btn-cancel" id="doneBtn">완료</button>
        </div>
      </div>
    </div>
  `;
}

function render(animate, kind){
  const pctRaw = (state.remainingMinutes / TOTAL_MIN) * 100;
  const pctBar = Math.max(0, Math.min(100, pctRaw));
  const pctLabel = Math.round(pctRaw);
  const dLeft = daysUntilNextMonday();
  const resetLabel = dLeft === 0 ? "오늘 자정 초기화" : `${dLeft}일 후 초기화`;
  const isOver = state.remainingMinutes > TOTAL_MIN;

  let overlayHtml = "";
  if(view === "settings"){
    overlayHtml = settingsStage === "lock" ? renderUnlockModal() : renderSettingsBody();
  }

  document.getElementById("root").innerHTML = `
    <div class="app">
      <button class="settings-btn" id="settingsBtn" aria-label="설정"></button>
      <p class="eyebrow">이번 주 남은 시간</p>
      <div id="timeDisplay" class="time ${isOver ? "over" : ""}" aria-live="polite">${formatTime(state.remainingMinutes)}</div>
      <p class="sub">기준 4시간 30분</p>
      <div class="track"><div class="fill" style="width:${pctBar}%"></div></div>
      <div class="track-label"><span>0</span><span>${pctLabel}%</span><span>270분</span></div>
      <div class="buttons">
        <button class="act btn-add" id="btnAdd">
          <span class="face-circle">🐶</span>
          <span class="btn-label">빨리</span>
          <span class="btn-note">+1분</span>
        </button>
        <button class="act btn-sub" id="btnSub" ${state.remainingMinutes <= 0 ? "disabled" : ""}>
          <span class="face-circle">🐱</span>
          <span class="btn-label">무응답</span>
          <span class="btn-note">-1분</span>
        </button>
      </div>
      <p class="footer">🐶${state.addCount || 0} · 🐱${state.subCount || 0} · ${resetLabel}</p>
    </div>
    ${overlayHtml}
  `;

  document.getElementById("btnAdd").addEventListener("click", addMinute);
  document.getElementById("btnSub").addEventListener("click", subMinute);
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  if(animate){
    const el = document.getElementById("timeDisplay");
    el.classList.add(kind === "add" ? "pulse-add" : "pulse-sub");
    setTimeout(()=> el.classList.remove(kind === "add" ? "pulse-add" : "pulse-sub"), 350);
  }

  if(view === "settings"){
    const closeBtn = document.getElementById("closeBtn");
    if(closeBtn) closeBtn.addEventListener("click", closeOverlay);

    if(settingsStage === "lock"){
      const cancelBtn = document.getElementById("cancelBtn");
      if(cancelBtn) cancelBtn.addEventListener("click", closeOverlay);
      const unlockBtn = document.getElementById("unlockBtn");
      if(unlockBtn) unlockBtn.addEventListener("click", submitUnlock);
      const input = document.getElementById("unlockPinInput");
      if(input){
        input.focus();
        input.addEventListener("keydown", (e) => { if(e.key === "Enter") submitUnlock(); });
        input.addEventListener("input", () => { input.value = input.value.replace(/[^0-9]/g,"").slice(0,4); });
      }
    } else {
      document.getElementById("doneBtn").addEventListener("click", closeOverlay);
      document.getElementById("applyTimeBtn").addEventListener("click", applyTimeSet);
      document.getElementById("applyPinBtn").addEventListener("click", applyPinChange);
      ["oldPinInput","newPinInput","newPinInput2"].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener("input", () => { el.value = el.value.replace(/[^0-9]/g,"").slice(0,4); });
      });
    }
  }
}

render();
</script>
</body>
</html>
