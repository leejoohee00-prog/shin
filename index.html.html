<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>발표 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10;
    --panel: #14171D;
    --panel-line: #262B33;
    --fg: #F3F5F7;
    --fg-dim: #8A93A1;
    --amber: #F0A93C;
    --amber-dim: #6B5228;
    --green: #34D399;
    --red: #FF4B5C;
    --ring-track: #1E222A;
    --danger-bg: #2A1013;

    /* zoo theme */
    --sky-top: #8FD3F4;
    --sky-bottom: #C9ECFB;
    --grass-top: #7BC96F;
    --grass-bottom: #559B4B;
    --wood: #A9713F;
    --wood-dark: #7A4E27;
    --card-cream: #FFF7E4;
    --card-text: #5B3A1E;
    --card-text-dim: #8A6B49;
    --elephant: #A7B0B8;
    --elephant-dark: #838D95;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:
      radial-gradient(90px 90px at 87% 10%, #FFDE7A 0%, #FFDE7A 55%, transparent 60%),
      radial-gradient(110px 55px at 12% 14%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(80px 42px at 26% 20%, rgba(255,255,255,0.75), transparent 70%),
      linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 58%, var(--grass-top) 58%, var(--grass-bottom) 100%);
    color:var(--fg);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  .zoo-critter{
    position:fixed;
    pointer-events:none;
    font-size:56px;
    opacity:0.4;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    transition: background 0.4s ease;
  }

  .app.finished{
    background: var(--danger-bg);
  }

  /* ---------- SETUP SCREEN ---------- */
  #setupScreen{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;
  }

  .setup-title{
    text-align:center;
  }
  .setup-title .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--amber);
  }

  .time-input-group{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:14px;
    background:var(--card-cream);
    border:6px solid var(--wood);
    border-radius:24px;
    padding:28px 32px;
    width:100%;
    box-shadow: 0 10px 26px rgba(0,0,0,0.18);
  }
  .field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .field label{
    font-size:13px;
    color:var(--card-text-dim);
    font-weight:700;
  }
  .field input{
    width:100%;
    max-width:120px;
    background:transparent;
    border:none;
    color:var(--card-text);
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(40px, 10vw, 56px);
    text-align:center;
    outline:none;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .colon{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(32px, 8vw, 44px);
    color:var(--wood);
    align-self:center;
    padding-top:22px;
  }

  .presets{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
  }
  .preset-btn{
    padding:12px 22px;
    border-radius:999px;
    border:2px solid var(--wood);
    background:var(--card-cream);
    color:var(--wood-dark);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .preset-btn:hover{ background:var(--wood); color:#fff; }
  .preset-btn:active{
    background:var(--wood-dark);
    border-color:var(--wood-dark);
    color:#fff;
    transform:scale(0.96);
  }

  .start-btn{
    position:relative;
    width:100%;
    padding:22px;
    margin-top:14px;
    border-radius:26px;
    border:none;
    background:linear-gradient(180deg, var(--elephant) 0%, var(--elephant-dark) 100%);
    color:#242A2E;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(20px, 4vw, 26px);
    cursor:pointer;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .start-btn::before,
  .start-btn::after{
    content:"";
    position:absolute;
    top:-16px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--elephant);
    z-index:-1;
  }
  .start-btn::before{ left:14px; }
  .start-btn::after{ right:14px; }
  .start-btn .emoji{ font-size:1.3em; line-height:1; }
  .start-btn:hover{ filter:brightness(1.06); }
  .start-btn:active{ transform:scale(0.98); }

  /* ---------- TIMER SCREEN ---------- */
  #timerScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:40px;
    width:100%;
    height:100%;
  }

  .timer-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:40px;
    background:rgba(10,12,16,0.9);
    border:6px solid var(--wood);
    border-radius:36px;
    padding:clamp(24px, 4vw, 56px) clamp(20px, 5vw, 60px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    max-width:96vw;
    max-height:94dvh;
  }

  .label-tag{
    font-family:'Inter', sans-serif;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:clamp(13px, 1.6vw, 16px);
    color:var(--fg-dim);
  }

  .ring-wrap{
    position:relative;
    width:min(62vmin, 560px);
    height:min(62vmin, 560px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }

  .ring-track{
    fill:none;
    stroke:var(--ring-track);
    stroke-width:14;
  }
  .ring-progress{
    fill:none;
    stroke: var(--fg);
    stroke-width:14;
    stroke-linecap:round;
    transition: stroke-dashoffset 0.9s linear, stroke 0.3s ease;
  }

  .time-display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:min(20vmin, 190px);
    line-height:1;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
    color:var(--fg);
    transition: color 0.3s ease;
  }

  .time-display.state-green{ color:var(--green); }
  .time-display.state-red{ color:var(--red); animation: blink-red 1s steps(1) infinite; }
  .ring-progress.state-green{ stroke:var(--green); }
  .ring-progress.state-red{ stroke:var(--red); animation: blink-ring 1s steps(1) infinite; }

  @keyframes blink-red{
    0%, 49%{ opacity:1; }
    50%, 100%{ opacity:0.25; }
  }
  @keyframes blink-ring{
    0%, 49%{ opacity:1; }
    50%, 100%{ opacity:0.25; }
  }

  /* 10~6 seconds: building tension, mild rumble */
  .ring-wrap.rumble{
    animation: shake-wrap-mild 0.5s ease-in-out infinite;
  }
  @keyframes shake-wrap-mild{
    0%{ transform: translate(0,0) rotate(0deg); }
    25%{ transform: translate(-3px, 2px) rotate(-0.5deg); }
    50%{ transform: translate(3px, -2px) rotate(0.5deg); }
    75%{ transform: translate(-2px, -2px) rotate(-0.4deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }

  /* last 5 seconds: shake + pulse like it's about to explode */
  .ring-wrap.critical{
    animation: shake-wrap 0.28s ease-in-out infinite;
  }
  .time-display.state-red.critical{
    animation: blink-red 1s steps(1) infinite, pulse-grow 0.28s ease-in-out infinite;
  }
  @keyframes shake-wrap{
    0%{ transform: translate(0,0) rotate(0deg); }
    20%{ transform: translate(-6px, 4px) rotate(-1.2deg); }
    40%{ transform: translate(5px, -5px) rotate(1.4deg); }
    60%{ transform: translate(-5px, -3px) rotate(-0.8deg); }
    80%{ transform: translate(6px, 4px) rotate(1deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }
  @keyframes pulse-grow{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }

  .end-message{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 44px);
    color:var(--red);
    letter-spacing:0.02em;
  }

  .controls{
    display:flex;
    gap:16px;
    width:100%;
    max-width:640px;
    padding:0 12px;
  }

  .ctrl-btn{
    flex:1;
    padding:20px 12px;
    border-radius:16px;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--fg);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:clamp(15px, 2vw, 18px);
    cursor:pointer;
    transition: all 0.12s ease;
  }
  .ctrl-btn:hover{ border-color:var(--fg-dim); }
  .ctrl-btn:active{ transform:scale(0.97); }

  .ctrl-btn.primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#1A1300;
  }
  .ctrl-btn.primary:hover{ filter:brightness(1.08); }

  .ctrl-btn.danger:hover{ border-color:var(--red); color:var(--red); }

  [hidden]{ display:none !important; }

  @media (max-width:480px){
    .controls{ flex-wrap:wrap; }
    .ctrl-btn{ flex:1 1 45%; }
  }
</style>
</head>
<body>

<!-- zoo scenery decorations -->
<span class="zoo-critter" style="left:4%; bottom:6%;">🦁</span>
<span class="zoo-critter" style="left:82%; bottom:5%; font-size:64px;">🦒</span>
<span class="zoo-critter" style="left:20%; bottom:3%; font-size:40px;">🐒</span>
<span class="zoo-critter" style="left:65%; bottom:4%; font-size:44px;">🦓</span>
<span class="zoo-critter" style="left:45%; bottom:2%; font-size:36px;">🌴</span>
<span class="zoo-critter" style="left:6%; bottom:2%; font-size:34px;">🌳</span>

<div class="app" id="app">

  <!-- SETUP -->
  <section id="setupScreen">
    <div class="setup-title">
      <div class="eyebrow">Presentation Timer</div>
    </div>

    <div class="time-input-group">
      <div class="field">
        <input type="number" id="minInput" value="0" min="0" max="180" inputmode="numeric">
        <label>분</label>
      </div>
      <div class="colon">:</div>
      <div class="field">
        <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric">
        <label>초</label>
      </div>
    </div>

    <div class="presets">
      <button class="preset-btn" data-add="1">+1분</button>
      <button class="preset-btn" data-add="5">+5분</button>
      <button class="preset-btn" data-add="10">+10분</button>
      <button class="preset-btn" data-add="-1">-1분</button>
      <button class="preset-btn" data-add="-5">-5분</button>
    </div>

    <button class="start-btn" id="startBtn"><span class="emoji">🐘</span> 시작</button>
  </section>

  <!-- TIMER -->
  <section id="timerScreen" hidden>
    <div class="timer-panel">
      <div class="label-tag" id="statusTag">발표 진행 중</div>

      <div class="ring-wrap" id="ringWrap">
        <svg viewBox="0 0 500 500">
          <circle class="ring-track" cx="250" cy="250" r="230"></circle>
          <circle class="ring-progress" id="ringProgress" cx="250" cy="250" r="230"></circle>
        </svg>
        <div class="time-display" id="timeDisplay">00:00</div>
      </div>

      <div class="controls">
        <button class="ctrl-btn primary" id="pauseBtn">일시정지</button>
        <button class="ctrl-btn" id="resetBtn">리셋</button>
        <button class="ctrl-btn danger" id="stopBtn">정지</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  const appEl = document.getElementById('app');
  const setupScreen = document.getElementById('setupScreen');
  const timerScreen = document.getElementById('timerScreen');
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stopBtn = document.getElementById('stopBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const ringProgress = document.getElementById('ringProgress');
  const ringWrap = document.getElementById('ringWrap');
  const statusTag = document.getElementById('statusTag');
  const presetBtns = document.querySelectorAll('.preset-btn');

  const RADIUS = 230;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  ringProgress.style.strokeDasharray = CIRCUMFERENCE;
  ringProgress.style.strokeDashoffset = 0;

  let totalSeconds = 0;
  let remaining = 0;
  let intervalId = null;
  let isPaused = false;
  let isFinished = false;
  let lastCriticalSecond = null;

  // last 5 seconds: countdown digit morphs into an animal whose shape echoes the numeral
  const ANIMAL_MAP = {
    5: '🐍',  // 뱀 - 5의 구불구불한 곡선
    4: '🦌',  // 사슴 - 4의 뾰족한 뿔 모양 꼭짓점
    3: '🦋',  // 나비 - 3의 대칭적인 두 곡선(날개)
    2: '🦢',  // 백조 - 2의 목처럼 휘어진 곡선
    1: '🦒'   // 기린 - 1의 가늘고 긴 세로선
  };

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const add = parseInt(btn.dataset.add, 10) || 0;
      const currentTotalMin = (parseInt(minInput.value, 10) || 0);
      minInput.value = Math.max(0, Math.min(180, currentTotalMin + add));
    });
  });

  function formatTime(s){
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function updateVisualState(){
    timeDisplay.classList.remove('state-green','state-red');
    ringProgress.classList.remove('state-green','state-red');
    if(remaining <= 30){
      timeDisplay.classList.add('state-red');
      ringProgress.classList.add('state-red');
    } else if(remaining <= 60){
      timeDisplay.classList.add('state-green');
      ringProgress.classList.add('state-green');
    }

    timeDisplay.classList.remove('critical');
    ringWrap.classList.remove('critical','rumble');

    if(!isFinished && remaining > 0){
      if(remaining <= 5){
        timeDisplay.classList.add('critical');
        ringWrap.classList.add('critical');
      } else if(remaining <= 10){
        ringWrap.classList.add('rumble');
      }
    }
  }

  function render(){
    if(!isFinished && remaining >= 1 && remaining <= 5){
      timeDisplay.textContent = ANIMAL_MAP[remaining];
    } else {
      timeDisplay.textContent = formatTime(remaining);
    }
    const fraction = totalSeconds > 0 ? remaining / totalSeconds : 0;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
    updateVisualState();
  }

  let sharedCtx = null;
  function getCtx(){
    if(!sharedCtx){
      sharedCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return sharedCtx;
  }

  function playNote(ctx, freq, startAt, dur, type, peakGain){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type || 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
    gain.gain.exponentialRampToValueAtTime(peakGain || 0.25, ctx.currentTime + startAt + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + dur);
    osc.start(ctx.currentTime + startAt);
    osc.stop(ctx.currentTime + startAt + dur + 0.02);
  }

  // sharp countdown tick for the last 5 seconds
  function playCriticalTick(){
    try{
      const ctx = getCtx();
      playNote(ctx, 1046.5, 0, 0.12, 'square', 0.22);
    }catch(e){}
  }

  // soft, low tension-building tick for 10~6 seconds
  function playRumbleTick(){
    try{
      const ctx = getCtx();
      playNote(ctx, 196.0, 0, 0.18, 'sine', 0.12);
    }catch(e){}
  }

  // short piano-like waltz phrase, in the spirit of Chopin, played when time is up
  function playChopinFinale(){
    try{
      const ctx = getCtx();
      const beat = 0.28;
      // a gentle descending waltz figure, triple-meter feel (long-short-short)
      const melody = [
        { n: 587.33, d: 2 },   // D5
        { n: 698.46, d: 1 },   // F5
        { n: 880.00, d: 1 },   // A5
        { n: 783.99, d: 2 },   // G5
        { n: 698.46, d: 1 },   // F5
        { n: 659.25, d: 1 },   // E5
        { n: 587.33, d: 2 },   // D5
        { n: 523.25, d: 1 },   // C5
        { n: 587.33, d: 1 },   // D5
        { n: 493.88, d: 3 },   // B4 (resolve)
      ];
      let t = 0;
      melody.forEach(note => {
        const dur = note.d * beat;
        playNote(ctx, note.n, t, dur * 0.95, 'triangle', 0.22);
        playNote(ctx, note.n / 2, t, dur * 0.95, 'sine', 0.08);
        t += dur;
      });
    }catch(e){}
  }

  function tick(){
    if(isPaused || isFinished) return;
    remaining -= 1;
    if(remaining <= 0){
      remaining = 0;
      render();
      finish();
      return;
    }
    render();
    if(remaining <= 10 && remaining > 5 && remaining !== lastCriticalSecond){
      lastCriticalSecond = remaining;
      playRumbleTick();
    } else if(remaining <= 5 && remaining !== lastCriticalSecond){
      lastCriticalSecond = remaining;
      playCriticalTick();
    }
  }

  function finish(){
    isFinished = true;
    clearInterval(intervalId);
    intervalId = null;
    appEl.classList.add('finished');
    statusTag.textContent = '시간 종료';
    timeDisplay.textContent = '종료';
    timeDisplay.classList.remove('state-green','critical');
    timeDisplay.classList.add('state-red');
    ringProgress.classList.remove('state-green');
    ringProgress.classList.add('state-red');
    ringWrap.classList.remove('critical','rumble');
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
    pauseBtn.disabled = true;
    playChopinFinale();
  }

  function startTimer(){
    const m = parseInt(minInput.value, 10) || 0;
    const s = parseInt(secInput.value, 10) || 0;
    totalSeconds = Math.max(1, m * 60 + s);
    remaining = totalSeconds;
    isPaused = false;
    isFinished = false;
    lastCriticalSecond = null;
    appEl.classList.remove('finished');
    pauseBtn.disabled = false;
    pauseBtn.textContent = '일시정지';
    statusTag.textContent = '발표 진행 중';
    setupScreen.hidden = true;
    timerScreen.hidden = false;
    render();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  function togglePause(){
    if(isFinished) return;
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? '재개' : '일시정지';
    statusTag.textContent = isPaused ? '일시정지됨' : '발표 진행 중';
  }

  function resetTimer(){
    remaining = totalSeconds;
    isPaused = false;
    isFinished = false;
    lastCriticalSecond = null;
    appEl.classList.remove('finished');
    timeDisplay.classList.remove('critical');
    ringWrap.classList.remove('critical','rumble');
    pauseBtn.disabled = false;
    pauseBtn.textContent = '일시정지';
    statusTag.textContent = '발표 진행 중';
    render();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  function stopTimer(){
    clearInterval(intervalId);
    intervalId = null;
    isPaused = false;
    isFinished = false;
    lastCriticalSecond = null;
    appEl.classList.remove('finished');
    timeDisplay.classList.remove('critical');
    ringWrap.classList.remove('critical','rumble');
    timerScreen.hidden = true;
    setupScreen.hidden = false;
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', resetTimer);
  stopBtn.addEventListener('click', stopTimer);

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){
      e.preventDefault();
      if(!timerScreen.hidden){ togglePause(); }
      else { startTimer(); }
    }
  });

  render();
})();
</script>

</body>
</html>
